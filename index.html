<!DOCTYPE html>
<html lang="es">

<head>
<script 
    src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">    
</script>

<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horas Extras OYM</title>

    <style>
        
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
}
    
button:hover{
    background:#0052a3;
}

.btn-delete{
    background:#dc3545;
}

.btn-edit{
    background:#f39c12;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#0066cc;
    color:white;
}

</style>
</head>

<body>

<h1>Horas Extras OYM</h1>

<div class="card">

<h2>Datos Personales</h2>

<input id="nombre" placeholder="Nombre">
<input id="cedula" placeholder="Cédula">
<input id="area" placeholder="Área">
<input id="ciudad" placeholder="Ciudad">

<button onclick="guardarPerfil()">
Guardar Perfil
</button>

</div>

<div class="card">

<h2>Nuevo Registro</h2>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Hora Inicio</label>
<input type="time" id="inicio">

<label>Hora Final</label>
<input type="time" id="fin">

<label>Tiempo Total</label>
<input type="text" id="total" readonly>

<label>Tipo</label>

<select id="tipo">
<option>Diurnas</option>
<option>Nocturna</option>
<option>Rec Ord. Nocturno</option>
<option>Rec Diurno Dom Compensado</option>
<option>Rec Noct. Dom Compensado</option>
<option>Trabajo Ocasional Dom/Fest Diurno</option>
<option>Trabajo Ocasional Dom/Fest Noct.</option>
<option>Extra Dom/Fest Diurno</option>
<option>Extra Dom/Fest Noct</option>
</select>

<label>Sitio de Trabajo</label>
<input type="text" id="sitio" value="Cali">

<label>Actividad</label>

<textarea id="actividad" rows="4">Diagnóstico, atención, escalación de incidentes de clientes externos.</textarea>

<button onclick="agregarRegistro()">
Agregar Registro
</button>

</div>

<div class="card">

<h2>Registros</h2>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Inicio</th>
<th>Final</th>
<th>Total</th>
<th>Tipo</th>
<th>Sitio</th>
<th>Actividad</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaRegistros"></tbody>

</table>

<br>

<h3 id="totalRegistros">
Total Registros: 0
</h3>

    <h3 id="totalHoras">
Total Horas: 00:00
</h3>

<br>

<button onclick="exportarRespaldo()">
📁 Exportar Respaldo
</button>

<input
type="file"
id="archivoRespaldo"
style="display:none"
onchange="importarRespaldo(event)">

<button onclick="document.getElementById('archivoRespaldo').click()">
📂 Importar Respaldo
</button>

<br><br>

<button onclick="exportarExcel()">
📈 Generar Excel
</button>
    
</div>

</div>

<script>

let registros =
JSON.parse(localStorage.getItem("registros")) || [];

let editandoIndice = -1;

function guardarPerfil(){

localStorage.setItem(
"nombre",
document.getElementById("nombre").value
);

localStorage.setItem(
"cedula",
document.getElementById("cedula").value
);

localStorage.setItem(
"area",
document.getElementById("area").value
);

localStorage.setItem(
"ciudad",
document.getElementById("ciudad").value
);

alert("Perfil guardado");

}

function calcularTiempo(){

let inicio =
document.getElementById("inicio").value;

let fin =
document.getElementById("fin").value;

if(!inicio || !fin) return;

let hInicio =
new Date("2000-01-01 " + inicio);

let hFin =
new Date("2000-01-01 " + fin);

if(hFin < hInicio){

hFin.setDate(
hFin.getDate()+1
);

}

let diferencia =
(hFin - hInicio) / 1000;

let horas =
Math.floor(diferencia / 3600);

let minutos =
Math.floor((diferencia % 3600) / 60);

document.getElementById("total").value =
horas.toString().padStart(2,'0')
+
":"
+
minutos.toString().padStart(2,'0');

}

document
.getElementById("inicio")
.addEventListener("change", calcularTiempo);

document
.getElementById("fin")
.addEventListener("change", calcularTiempo);

function agregarRegistro(){

const registro = {

fecha:
document.getElementById("fecha").value,

inicio:
document.getElementById("inicio").value,

fin:
document.getElementById("fin").value,

total:
document.getElementById("total").value,

tipo:
document.getElementById("tipo").value,

sitio:
document.getElementById("sitio").value,

actividad:
document.getElementById("actividad").value

};

if(editandoIndice >= 0){

registros[editandoIndice] = registro;

editandoIndice = -1;

}else{

registros.push(registro);

}

localStorage.setItem(
"registros",
JSON.stringify(registros)
);

limpiarFormulario();

cargarTabla();

}

function editarRegistro(indice){

let r = registros[indice];

document.getElementById("fecha").value =
r.fecha;

document.getElementById("inicio").value =
r.inicio;

document.getElementById("fin").value =
r.fin;

document.getElementById("total").value =
r.total;

document.getElementById("tipo").value =
r.tipo;

document.getElementById("sitio").value =
r.sitio;

document.getElementById("actividad").value =
r.actividad;

editandoIndice = indice;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function eliminarRegistro(indice){

if(confirm("¿Desea eliminar este registro?")){

registros.splice(indice,1);

localStorage.setItem(
"registros",
JSON.stringify(registros)
);

cargarTabla();

}

}

function limpiarFormulario(){

document.getElementById("fecha").value = "";
document.getElementById("inicio").value = "";
document.getElementById("fin").value = "";
document.getElementById("total").value = "";

}

function cargarTabla(){

const tabla =
document.getElementById("tablaRegistros");

tabla.innerHTML = "";

let minutosTotales = 0;

registros.forEach((r,index) => {

tabla.innerHTML += `
<tr>
<td>${r.fecha}</td>
<td>${r.inicio}</td>
<td>${r.fin}</td>
<td>${r.total}</td>
<td>${r.tipo}</td>
<td>${r.sitio}</td>
<td>${r.actividad}</td>
<td>

<button
class="btn-edit"
onclick="editarRegistro(${index})">
✏️
</button>

<button
class="btn-delete"
onclick="eliminarRegistro(${index})">
🗑️
</button>

</td>
</tr>
`;

let partes = r.total.split(":");

let horas =
parseInt(partes[0]) || 0;

let minutos =
parseInt(partes[1]) || 0;

minutosTotales +=
(horas * 60) + minutos;

});

let totalHoras =
Math.floor(minutosTotales / 60);

let totalMinutos =
minutosTotales % 60;

document.getElementById(
"totalRegistros"
).innerText =
"Total Registros: " + registros.length;

document.getElementById(
"totalHoras"
).innerText =
"Total Horas: "
+
totalHoras.toString().padStart(2,'0')
+
":"
+
totalMinutos.toString().padStart(2,'0');

}
function exportarRespaldo(){

let datos = {

perfil:{

nombre:
localStorage.getItem("nombre"),

cedula:
localStorage.getItem("cedula"),

area:
localStorage.getItem("area"),

ciudad:
localStorage.getItem("ciudad")

},

registros: registros

};

let contenido =
JSON.stringify(datos,null,2);

let blob =
new Blob(
[contenido],
{type:"application/json"}
);

let enlace =
document.createElement("a");

enlace.href =
URL.createObjectURL(blob);

enlace.download =
"horas_extras_respaldo.json";

document.body.appendChild(enlace);

enlace.click();

document.body.removeChild(enlace);

}

function importarRespaldo(event){

let archivo =
event.target.files[0];

if(!archivo)return;

let lector =
new FileReader();

lector.onload = function(e){

let datos =
JSON.parse(e.target.result);

localStorage.setItem(
"nombre",
datos.perfil.nombre || ""
);

localStorage.setItem(
"cedula",
datos.perfil.cedula || ""
);

localStorage.setItem(
"area",
datos.perfil.area || ""
);

localStorage.setItem(
"ciudad",
datos.perfil.ciudad || ""
);

registros =
datos.registros || [];

localStorage.setItem(
"registros",
JSON.stringify(registros)
);

alert("Respaldo cargado correctamente");

location.reload();

};

lector.readAsText(archivo);

}
function exportarExcel(){

if(registros.length === 0){

alert("No existen registros para exportar");
return;

}

let datosExcel = [];

registros.forEach(r => {

let fechaFormateada = r.fecha;

if(fechaFormateada){

let partes = fechaFormateada.split("-");

if(partes.length === 3){

fechaFormateada =
partes[2] + "/" +
partes[1] + "/" +
partes[0];

}

}

datosExcel.push({

"Fecha": fechaFormateada,
"Hora Inicio": r.inicio,
"Hora Final": r.fin,
"Tiempo Total": r.total,
"Tipo": r.tipo,
"Sitio": r.sitio,
"Actividad": r.actividad

});

});

let ws =
XLSX.utils.json_to_sheet(datosExcel);

let wb =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Horas Extras"
);

let nombre =
document.getElementById("nombre").value || "Empleado";

let fechaActual =
new Date();

let mes =
String(fechaActual.getMonth()+1)
.padStart(2,"0");

let anio =
fechaActual.getFullYear();

XLSX.writeFile(
wb,
nombre + " - " + mes + anio + ".xlsx"
);

}

let datosExcel = [];

registros.forEach(r => {

datosExcel.push({

"Fecha": r.fecha,
"Hora Inicio": r.inicio,
"Hora Final": r.fin,
"Tiempo Total": r.total,
"Tipo": r.tipo,
"Sitio": r.sitio,
"Actividad": r.actividad
});
});
const hoja =
XLSX.utils.json_to_sheet(datosExcel);
const libro =
XLSX.utils.book_new();
XLSX.utils.book_append_sheet(
libro,
hoja,
"Horas Extras"
);
let fecha =
new Date();
let mes =
String(fecha.getMonth()+1)
.padStart(2,'0');
let anio =
fecha.getFullYear();
let nombre =
document.getElementById("nombre").value || "Empleado";
let nombreArchivo =
nombre +
" - " +
mes +
anio +
".xlsx";
XLSX.writeFile(
libro,
nombreArchivo
);
}
window.onload = function(){

document.getElementById("nombre").value =
localStorage.getItem("nombre") || "";

document.getElementById("cedula").value =
localStorage.getItem("cedula") || "";

document.getElementById("area").value =
localStorage.getItem("area") || "";

document.getElementById("ciudad").value =
localStorage.getItem("ciudad") || "";

cargarTabla();

};

</script>

</body>
</html>
